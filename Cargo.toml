[package]
name = "aether-tray"
version = "0.1.0"
edition = "2024"
authors = ["Aether Project"]
license = "AGPL-3.0-or-later"
description = "Tray-only native client for the Aether censorship-circumvention tool"
repository = "https://github.com/CluvexStudio/aether-tray"

[dependencies]
tray-icon = "0.19"
muda = "0.15"
winit = "0.30"
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify-rust = "4.11"
arboard = "3.4"
interprocess = "2.2"
clap = { version = "4.5", features = ["derive"] }
rfd = "0.15"
anyhow = "1.0"
dirs = "5.0"
which = "6.0"
ctrlc = "3.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
strip = true
opt-level = "z"
