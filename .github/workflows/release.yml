name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            aether_asset: aether-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            aether_asset: aether-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            aether_asset: aether-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      # AETHER_ASSET pins the core to the *target* arch, not the runner's —
      # the macOS x86_64 build runs on an Intel runner but this keeps the
      # pairing explicit and lets arm64 cross-build if the runner changes.
      # `shell: bash` matters on Windows: the default there is PowerShell,
      # and this is a bash script.
      - name: Fetch the Aether core
        if: matrix.aether_asset != ''
        shell: bash
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: ./binaries/fetch-aether.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./packaging/macos-app.sh
          cd dist
          # -y preserves the symlinks inside a .app bundle.
          zip -ry "Aether-${{ matrix.name }}.zip" Aether.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get install -y libfuse2
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          ./packaging/linux-appimage.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: pwsh -File packaging/windows-zip.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # Bundles are ad-hoc signed only, which Gatekeeper will still warn
          # about — say so rather than letting users discover it.
          body: |
            Built by CI from ${{ github.ref_name }}.

            The macOS bundle is ad-hoc signed, not notarised: right-click →
            Open on first launch. Linux needs a StatusNotifierItem host
            (GNOME requires an AppIndicator extension) — the AppImage falls
            back to `--no-tray` when none is found.
          draft: true
