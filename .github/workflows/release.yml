name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Don't run two releases for the same ref at once (e.g. a second push to main
# while the first is still packaging).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A job that can't find a runner (or hangs) should fail loudly instead of
    # sitting in the queue forever.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired by GitHub in Dec 2025, which is why the
          # x86_64 job was stuck "waiting for a runner". Standard macOS 15
          # images run on Apple silicon; Intel builds need the -intel label.
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            aether_asset: aether-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            aether_asset: aether-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            aether_asset: aether-linux-aarch64.tar.gz
            cross: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            aether_asset: aether-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # ── Linux native deps ──────────────────────────────────────────────
      - name: Install Linux tray dependencies (native)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # ── Linux cross-compilation (aarch64 on an x86_64 runner) ──────────
      # The rules that make this work:
      #   * amd64 packages come from archive/security.ubuntu.com only.
      #   * arm64 packages come from ports.ubuntu.com only — the main archive
      #     servers do NOT carry arm64 (they 404), and neither does
      #     security.ubuntu.com, so the -security suite must use ports too.
      #   * Ubuntu 24.04+ runners use DEB822 (.sources) files. Those need an
      #     explicit "Architectures: amd64" key; some images ship it and some
      #     don't, so handle both. Without it apt tries to fetch arm64 from
      #     archive.ubuntu.com and apt-get update dies with 404s.
      - name: Install Linux tray dependencies (cross aarch64)
        if: runner.os == 'Linux' && matrix.cross
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64

          # Drop third-party repos (they don't publish arm64) and any previous
          # ports list so this step is idempotent on re-runs.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/arm64-ports.list

          # DEB822 (.sources): force amd64 — set the key if present, insert it
          # after each "Types:" line if absent.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if sudo grep -q '^Architectures:' "$f"; then
              sudo sed -i 's/^Architectures:.*/Architectures: amd64/' "$f"
            else
              sudo sed -i '/^Types:/a Architectures: amd64' "$f"
            fi
          done

          # Traditional one-line format: strip any existing arch tag, then tag
          # every deb line with amd64 (idempotent on images that already tag).
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sudo sed -i -e 's/^deb \[[^]]*\] /deb /' -e 's/^deb /deb [arch=amd64] /' "$f"
          done

          # arm64 packages come from ports.ubuntu.com for ALL suites,
          # including -security (security.ubuntu.com has no arm64).
          UBUNTU_CODENAME=$(. /etc/os-release && printf '%s' "$UBUNTU_CODENAME")
          for suite in "" "-updates" "-security" "-backports"; do
            echo "deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}${suite} main restricted universe multiverse" \
              | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list >/dev/null
          done

          # apt is flaky on shared runners: retry and lengthen timeouts.
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=120 \
            -o Acquire::https::Timeout=120
          sudo apt-get install -y \
            libgtk-3-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            libxdo-dev:arm64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          # Tell Cargo which linker to use for the cross target.
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      # ── Fetch the Aether core ──────────────────────────────────────────
      # AETHER_ASSET pins the core to the *target* arch, not the runner's.
      - name: Fetch the Aether core
        if: matrix.aether_asset != ''
        shell: bash
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: ./binaries/fetch-aether.sh

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── Package ────────────────────────────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./packaging/macos-app.sh
          cd dist
          # -y preserves the symlinks inside a .app bundle.
          zip -ry "Aether-${{ matrix.name }}.zip" Aether.app
          # Drag-and-drop DMG: open it and drop Aether.app onto Applications.
          ../packaging/macos-dmg.sh Aether.app "Aether-${{ matrix.name }}.dmg"

      - name: Package (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get install -y libfuse2
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          ./packaging/linux-appimage.sh

      - name: Package (Linux cross aarch64)
        if: runner.os == 'Linux' && matrix.cross
        env:
          TARGET: aarch64-unknown-linux-gnu
          APPIMAGE_ARCH: aarch64
        run: |
          sudo apt-get install -y libfuse2
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          ./packaging/linux-appimage.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: pwsh -File packaging/windows-zip.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.app
            dist/*.dmg
          if-no-files-found: error

  # ── Create the release ──────────────────────────────────────────────────
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # When triggered by a tag push the tag already exists; when triggered
      # by a push to main we create a lightweight tag from the Cargo.toml
      # version so that the release has a proper version identifier.
      - name: Determine version tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            TAG="v${VERSION}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"

            # Only create the tag if it doesn't already exist.
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        id: files
        run: |
          # Flatten all uploaded artifacts into a single list.
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.dmg' \) \
            | sort > release_files.txt
          echo "--- Release files ---"
          cat release_files.txt

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Aether ${{ steps.version.outputs.tag }}
          body: |
            ## Aether ${{ steps.version.outputs.tag }}

            Auto-built from `${{ github.sha }}`.

            ### Platforms
            | OS | Arch | Archive |
            |---|---|---|
            | macOS | ARM64 (Apple Silicon) | `Aether-macos-arm64.dmg` / `.zip` |
            | macOS | x86_64 (Intel) | `Aether-macos-x86_64.dmg` / `.zip` |
            | Linux | x86_64 | `Aether-linux-x86_64.AppImage` |
            | Linux | aarch64 | `Aether-linux-aarch64.AppImage` |
            | Windows | x86_64 | `Aether-windows-x86_64.zip` |

            Open the `.dmg`, then drag **Aether.app** into **Applications**.

            > **Note:** The macOS bundle is ad-hoc signed, not notarised —
            > right-click → Open on first launch. Linux needs a
            > StatusNotifierItem host (GNOME requires an AppIndicator
            > extension); the AppImage falls back to `--no-tray` when none
            > is found.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
          draft: false
          prerelease: false
